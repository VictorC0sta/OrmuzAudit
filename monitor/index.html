<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ormuz Command Center</title>
    <style>
    * { box-sizing: border-box; }
    body { margin: 0; background-color: #1e1e1e; color: #e0e0e0; }
    :root {
      --color-background-primary: #121212;
      --color-background-secondary: #1e1e1e;
      --color-background-success: #1b3320;
      --color-background-warning: #332711;
      --color-background-danger: #331414;
      --color-background-info: #11263d;
      --color-border-primary: #555;
      --color-border-secondary: #333;
      --color-border-tertiary: #222;
      --color-border-success: #2ea043;
      --color-border-warning: #d29922;
      --color-border-danger: #f85149;
      --color-border-info: #388bfd;
      --color-text-primary: #e6edf3;
      --color-text-secondary: #8b949e;
      --color-text-tertiary: #6e7681;
      --color-text-success: #3fb950;
      --color-text-warning: #d29922;
      --color-text-danger: #f85149;
      --color-text-info: #58a6ff;
      --border-radius-md: 4px;
      --border-radius-lg: 8px;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }
    select, input[type=text], input[type=number] {
      width: 100%; padding: 6px 10px; font-size: 12px;
      background: var(--color-background-primary);
      color: var(--color-text-primary);
      border: 0.5px solid var(--color-border-secondary);
      border-radius: var(--border-radius-md);
      font-family: var(--font-sans); margin: 0;
    }
    select:focus, input:focus { outline: none; border-color: var(--color-border-primary); }
    button {
      background: transparent; border: 0.5px solid var(--color-border-secondary);
      color: var(--color-text-secondary); border-radius: var(--border-radius-md);
      cursor: pointer; font-family: var(--font-sans); font-size: 12px;
      padding: 7px 12px; transition: background 0.15s, color 0.15s;
    }
    button:hover { background: var(--color-background-secondary); color: var(--color-text-primary); }
    button:disabled { opacity: 0.45; cursor: default; }
    input[type=range] { width: 100%; accent-color: var(--color-text-info); }
    input[type=checkbox] { accent-color: var(--color-text-info); cursor: pointer; }
    .card { background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 12px; }
    .mono { font-family: var(--font-mono); }
    .badge { font-size: 10px; padding: 2px 7px; border-radius: var(--border-radius-md); font-family: var(--font-mono); font-weight: 500; border: 0.5px solid; }
    .scroll { overflow-y: auto; scrollbar-width: thin; }
    pre { margin: 0; white-space: pre-wrap; font-family: var(--font-mono); font-size: 10px; color: var(--color-text-secondary); line-height: 1.6; }
    </style>
</head>
<body>
<div id="app" style="font-family:var(--font-sans);padding:1rem"></div>
<script>
(function() {
const PRIORITY_TABLE = {
  S1:["NORTE","OESTE","LESTE","SUL"], S2:["SUL","LESTE","OESTE","NORTE"],
  S3:["LESTE","NORTE","SUL","OESTE"], S4:["OESTE","NORTE","SUL","LESTE"],
  S5:["NORTE","LESTE","SUL","OESTE"], S6:["LESTE","NORTE","SUL","OESTE"],
  S7:["NORTE","SUL","LESTE","OESTE"], S8:["LESTE","SUL","NORTE","OESTE"]
};
const CRIT_PESO = {CRITICA:3, ALTA:2, BAIXA:1};
const TIPO_CRIT = {
  embarcacao_perigo:"CRITICA", bloqueio_rota:"ALTA",
  objeto_nao_identificado:"ALTA", embarcacao_deriva:"BAIXA",
  falha_sinalizacao:"BAIXA", anomalia_menor:"BAIXA"
};
const TIPOS = Object.keys(TIPO_CRIT);
const TIMEOUT_MS = {1:0,2:200,3:400,4:600};
const SECTOR_LAYOUT = [
  {id:"S1",col:0,row:0},{id:"S2",col:1,row:0},{id:"S5",col:2,row:0},{id:"S6",col:3,row:0},
  {id:"S3",col:0,row:1},{id:"S4",col:1,row:1},{id:"S7",col:2,row:1},{id:"S8",col:3,row:1}
];

// Cada setor pertence a uma empresa — mesmo mapeamento do docker/.env
const SECTOR_EMPRESA = {
  S1:"EMPRESA-A", S2:"EMPRESA-B", S3:"EMPRESA-C", S4:"EMPRESA-D",
  S5:"EMPRESA-E", S6:"EMPRESA-F", S7:"EMPRESA-G", S8:"EMPRESA-H"
};
const EMPRESAS = Object.values(SECTOR_EMPRESA);
// Custo em tokens por criticidade — usado SÓ para exibir informação na aba
// "Injetar Alerta" (espelha config/custo_por_criticidade.json). Esta tela
// NUNCA debita nada: o pagamento real é validado pela Base no Hyperledger
// Fabric, e só aparece aqui quando consultado de verdade na aba Auditoria.
const CUSTO_POR_CRIT = {CRITICA:3, ALTA:2, BAIXA:1};

let _uid=0;
const uid = () => `R${++_uid}`;
let lamportClock = 0;
const incLamport = () => ++lamportClock;

let STATE = {
  drones: [
    {id:"DRONE-NORTE-1",base:"NORTE",state:"LIVRE",mission:null,port:7001},
    {id:"DRONE-SUL-1",base:"SUL",state:"LIVRE",mission:null,port:7011},
    {id:"DRONE-LESTE-1",base:"LESTE",state:"LIVRE",mission:null,port:7021},
    {id:"DRONE-OESTE-1",base:"OESTE",state:"LIVRE",mission:null,port:7031}
  ],
  bases: {NORTE:true, SUL:true, LESTE:true, OESTE:true},
  queue: [],
  events: [],
  lamport: 0,
  tab: "inject",
  stats: {total:0, aceitas:0, concluidas:0, perdidos:0},
  bombarding: false, bombSent:0, bombTotal:0,
  bombCfg: {count:20,rate:3,sectors:"all",criticidade:"mixed"},
  newDrone: {id:"",base:"NORTE",port:7100},
  injectForm: {sector:"S1",tipo:"embarcacao_perigo"},
  // IMPORTANTE: desligado por padrão. O painel não deve gerar tráfego
  // "fantasma" sozinho — a simulação de fila/prioridade abaixo é só uma
  // ferramenta didática que o usuário aciona explicitamente.
  autoSim: false,
  wsUrl: "ws://localhost:8001",
  wsStatus: "sim", // "sim" = desconectado da bridge | "connected" | "error"
  wsObj: null,
  // ── Dados financeiros: SOMENTE vindos do Fabric real via bridge ──────────
  // Não existe aqui nenhum saldo, transação ou laudo fictício. Enquanto não
  // houver uma consulta real respondida pela bridge, estes objetos ficam
  // vazios e a aba Auditoria mostra isso de forma explícita — nada de número
  // inventado fingindo ser dado do ledger.
  saldosReais: {},
  auditoriaReal: {},
  auditFiltroEmpresa: "EMPRESA-A",
  ultimaTransferencia: null,
  transferForm: {origem:"EMPRESA-A", destino:"EMPRESA-B", valor:20}
};

let bombTimer = null;
let autoSimTimer = null;

// ── Fila e prioridade ───────────────────────────────────────────────────────
function sortByPriority(q) {
  return [...q].sort((a,b)=>{
    const pa=CRIT_PESO[a.crit]||1, pb=CRIT_PESO[b.crit]||1;
    if(pb!==pa) return pb-pa;
    if(a.ts!==b.ts) return a.ts-b.ts;
    return a.sector.localeCompare(b.sector);
  });
}

function log(msg, level="info") {
  const ts = new Date().toLocaleTimeString("pt-BR",{hour12:false});
  STATE.events.unshift({id:uid(),ts,msg,level});
  if(STATE.events.length>200) STATE.events.length=200;
}

// ── Simulação OFFLINE de fila/prioridade/timeout ────────────────────────────
// Isto demonstra apenas o algoritmo de exclusão mútua por janela de tempo
// (TDMA) do Problema 2 — quem aceita primeiro de acordo com a prioridade do
// setor. NÃO move nenhum token e NÃO escreve nada no ledger. O pagamento de
// verdade só existe no Hyperledger Fabric e só aparece na aba Auditoria.
function processQueue() {
  const pending = STATE.queue.filter(r=>r.status==="PENDENTE");
  if(!pending.length) return;
  const sorted = sortByPriority(pending);
  const free = STATE.drones.find(d=>d.state==="LIVRE" && STATE.bases[d.base]);
  if(!free) return;

  const req = sorted[0];
  const ts = lamportClock;
  req.status = "ACEITA";
  req.drone  = free.id;
  free.state = "OCUPADO";
  free.mission = req.id;
  log(`[${free.base}] Aceitou ${req.id} → ${free.id.replace("DRONE-","")} | L=${ts} (simulação local de fila/prioridade — não é o ledger real)`,"success");
  STATE.stats.aceitas++;

  const dur = 8000 + Math.random()*12000;
  const capturedDrone = free;
  const capturedReq   = req;
  setTimeout(()=>{
    if(capturedDrone.state === "OCUPADO") {
      capturedDrone.state = "LIVRE";
      capturedDrone.mission = null;
      capturedReq.status = "CONCLUIDA";
      STATE.stats.concluidas++;
      log(`✓ Missão ${capturedReq.id} concluída por ${capturedDrone.id.replace("DRONE-","")} (o laudo de verdade fica no Hyperledger, não nesta simulação)`,"success");
      setTimeout(processQueue,100);
      render();
    }
  }, dur);
  render();
}

function injectAlert(sector, tipo, crit) {
  const ts = incLamport();
  const id = uid();
  const empresa = SECTOR_EMPRESA[sector] || "EMPRESA-A";
  const req = {id, sector, tipo, crit, ts, status:"PENDENTE", drone:null, empresa};
  const lvl = crit==="CRITICA"?"critica":crit==="ALTA"?"alta":"info";
  log(`ALERTA ${sector} [${empresa}] | ${tipo.replace(/_/g," ")} [${crit}] | L=${ts}`,lvl);
  STATE.stats.total++;
  STATE.queue.push(req);
  STATE.queue = sortByPriority(STATE.queue);
  STATE.lamport = lamportClock;
  const order = PRIORITY_TABLE[sector]||["NORTE","SUL","LESTE","OESTE"];
  const onlineOrder = order.filter(b=>STATE.bases[b]);
  const pos = onlineOrder.length > 0 ? 1 : 4;
  const tmo = TIMEOUT_MS[pos]??600;
  setTimeout(()=>{ processQueue(); render(); }, tmo+50);
  render();
}

function startBombard() {
  STATE.bombarding=true; STATE.bombSent=0; STATE.bombTotal=STATE.bombCfg.count;
  log(`BOMBARDEAMENTO: ${STATE.bombCfg.count} alertas @ ${STATE.bombCfg.rate}/s`,"warn");
  let sent=0; const total=STATE.bombCfg.count;
  const interval=Math.max(50,1000/STATE.bombCfg.rate);
  const fire=()=>{
    if(sent>=total){STATE.bombarding=false;log(`Bombardeamento concluido: ${total} alertas`,"info");render();return;}
    const sAll=["S1","S2","S3","S4","S5","S6","S7","S8"];
    const s=STATE.bombCfg.sectors==="all"?sAll[Math.floor(Math.random()*8)]:STATE.bombCfg.sectors;
    let c; const r=Math.random();
    if(STATE.bombCfg.criticidade==="mixed") c=r<0.2?"CRITICA":r<0.5?"ALTA":"BAIXA";
    else c=STATE.bombCfg.criticidade;
    const t=TIPOS[Math.floor(Math.random()*TIPOS.length)];
    injectAlert(s,t,c);
    sent++; STATE.bombSent=sent;
    bombTimer=setTimeout(fire,interval);
    render();
  };
  fire();
}

function stopBombard() {
  if(bombTimer) clearTimeout(bombTimer);
  STATE.bombarding=false;
  log("Bombardeamento interrompido","warn");
  render();
}

function addDrone() {
  const nd=STATE.newDrone;
  if(!nd.id.trim()) return;
  STATE.drones.push({id:nd.id.trim(),base:nd.base,state:"LIVRE",mission:null,port:nd.port});
  log(`Drone ${nd.id} adicionado a base ${nd.base}`,"success");
  STATE.newDrone={id:"",base:nd.base,port:nd.port+10};
  setTimeout(()=>{processQueue();render();},200);
  render();
}

function killDrone(droneId) {
  const d=STATE.drones.find(x=>x.id===droneId);
  if(!d) return;
  d.state="PERDIDO";
  log(`Drone ${droneId.replace("DRONE-","")} marcado PERDIDO`,"warn");
  STATE.stats.perdidos++;
  if(d.mission){
    const req=STATE.queue.find(r=>r.id===d.mission);
    if(req){req.status="PENDENTE";req.drone=null;}
    log(`Missao ${d.mission} devolvida a fila`,"info");
    d.mission=null;
    setTimeout(()=>{processQueue();render();},300);
  }
  render();
}

function reviveDrone(droneId) {
  const d=STATE.drones.find(x=>x.id===droneId);
  if(!d) return;
  if(!STATE.bases[d.base]) {
    log(`Drone ${droneId.replace("DRONE-","")} não pode reviver — base ${d.base} offline`,"warn");
    render(); return;
  }
  d.state="LIVRE"; d.mission=null;
  log(`Drone ${droneId.replace("DRONE-","")} reconectado`,"success");
  setTimeout(()=>{processQueue();render();},200);
  render();
}

function removeDrone(droneId) {
  STATE.drones=STATE.drones.filter(d=>d.id!==droneId);
  log(`Drone ${droneId.replace("DRONE-","")} removido`,"warn");
  render();
}

function killBase(baseId) {
  if(!STATE.bases[baseId]) return;
  STATE.bases[baseId] = false;
  STATE.drones.filter(d=>d.base===baseId && d.state!=="PERDIDO").forEach(d=>{
    d.state="PERDIDO"; STATE.stats.perdidos++;
    if(d.mission){
      const req=STATE.queue.find(r=>r.id===d.mission);
      if(req){req.status="PENDENTE";req.drone=null;}
      log(`Missao ${d.mission} devolvida — base ${baseId} caiu`,"info");
      d.mission=null;
    }
  });
  log(`⚠ Base ${baseId} DESATIVADA — todos os drones offline`,"warn");
  setTimeout(()=>{processQueue();render();},300);
  render();
}

function reviveBase(baseId) {
  if(STATE.bases[baseId]) return;
  STATE.bases[baseId] = true;
  STATE.drones.filter(d=>d.base===baseId && d.state==="PERDIDO")
    .forEach(d=>{d.state="LIVRE"; d.mission=null;});
  log(`✔ Base ${baseId} RESTAURADA — drones reconectados`,"success");
  setTimeout(()=>{processQueue();render();},200);
  render();
}

function connectWs() {
  try {
    const ws=new WebSocket(STATE.wsUrl);
    ws.onopen=()=>{STATE.wsStatus="connected";log(`Conectado: ${STATE.wsUrl}`,"success");render();};
    ws.onmessage=(e)=>{
      try{
        const m=JSON.parse(e.data);
        if(m.tipo==="DRONE_DESPACHADO") log(`[${m.base}] ${m.drone} → Setor ${m.setor}`,"success");
        else if(m.tipo==="MISSAO_CONCLUIDA") log(`Missão concluída: drone ${m.drone}`,"success");
        else if(m.tipo==="ALERTA_GERADO") injectAlert(m.setor, m.tipo_ocorrencia||"anomalia_menor", m.criticidade);
        else if(m.tipo==="PAGAMENTO_RECUSADO") log(`✕ Pagamento recusado pelo ledger real: ${m.motivo}`,"warn");
        // Respostas reais do Fabric, vindas da bridge bidirecional —
        // são a ÚNICA fonte de dados financeiros mostrada nesta aplicação.
        else if(m.tipo_resposta==="SALDO") {
          STATE.saldosReais[m.empresa] = {saldo:m.saldo, status:m.status};
          log(`[Fabric] Saldo ${m.empresa}: ${m.saldo ?? "N/D"} (status: ${m.status})`,"info");
        } else if(m.tipo_resposta==="AUDITORIA") {
          STATE.auditoriaReal[m.empresa] = m.transacoes || [];
          log(`[Fabric] Auditoria ${m.empresa}: ${(m.transacoes||[]).length} transações`,"info");
        } else if(m.tipo_resposta==="TRANSFERENCIA") {
          STATE.ultimaTransferencia = {sucesso:m.sucesso, motivo:m.motivo};
          if(m.sucesso) log(`[Fabric] Transferência confirmada no ledger real`,"success");
          else log(`[Fabric] Transferência negada: ${m.motivo}`,"warn");
        }
        else {
          console.log(`[Bridge] Tipo de mensagem desconhecido: ${m.tipo || m.tipo_resposta}`);
        }
        render();
      }catch(e2){}
    };
    ws.onerror=()=>{STATE.wsStatus="error";render();};
    ws.onclose=()=>{STATE.wsStatus="sim";log("Desconectado do sistema real","warn");render();};
    STATE.wsObj=ws;
    render();
  }catch(e){STATE.wsStatus="error";log("Falha: "+e.message,"warn");render();}
}

// Envia uma chamada para o Fabric real via WebSocket bidirecional (monitor_bridge.py)
function chamarFabric(payload) {
  if(STATE.wsStatus!=="connected" || !STATE.wsObj) {
    log("Bridge não conectada. Use a aba Bridge para conectar ao sistema real.","warn");
    render(); return;
  }
  STATE.wsObj.send(JSON.stringify(payload));
}

function startAutoSim() {
  if(autoSimTimer) clearInterval(autoSimTimer);
  autoSimTimer=setInterval(()=>{
    if(!STATE.autoSim) return;
    if(Math.random()<0.4){
      const s=`S${Math.floor(Math.random()*8)+1}`;
      const t=TIPOS[Math.floor(Math.random()*TIPOS.length)];
      injectAlert(s,t,TIPO_CRIT[t]);
    }
  },4500);
}

// ─── Helpers de cor ────────────────────────────────────────────────────────
function c_crit(c){return{CRITICA:"var(--color-text-danger)",ALTA:"var(--color-text-warning)",BAIXA:"var(--color-text-info)"}[c]||"var(--color-text-secondary)"}
function bg_crit(c){return{CRITICA:"var(--color-background-danger)",ALTA:"var(--color-background-warning)",BAIXA:"var(--color-background-info)"}[c]||"var(--color-background-secondary)"}
function c_state(s){return{LIVRE:"var(--color-text-success)",OCUPADO:"var(--color-text-warning)",PERDIDO:"var(--color-text-danger)"}[s]||"var(--color-text-secondary)"}
function bg_state(s){return{LIVRE:"var(--color-background-success)",OCUPADO:"var(--color-background-warning)",PERDIDO:"var(--color-background-danger)"}[s]||"var(--color-background-secondary)"}
function c_log(l){return{success:"var(--color-text-success)",warn:"var(--color-text-warning)",critica:"var(--color-text-danger)",alta:"var(--color-text-warning)",info:"var(--color-text-secondary)"}[l]||"var(--color-text-secondary)"}

// ─── Mapa tático ───────────────────────────────────────────────────────────
function renderMap() {
  const sW=64,sH=54,mX=8,mY=26,gX=4,gY=4;
  const totalW=mX*2+4*sW+3*gX;
  const totalH=mY*2+2*sH+gY;
  const pendByS={},actByS={};
  STATE.queue.forEach(r=>{
    if(r.status==="PENDENTE") pendByS[r.sector]=(pendByS[r.sector]||0)+1;
    if(r.status==="ACEITA") actByS[r.sector]=r.crit;
  });
  let sectors="",dronePts="";
  SECTOR_LAYOUT.forEach(({id,col,row})=>{
    const x=mX+col*(sW+gX), y=mY+row*(sH+gY);
    const p=pendByS[id]||0, a=actByS[id];
    const fl=p>0?(p>2?"danger":"warning"):a?"info":"none";
    const fillMap={danger:"rgba(209,55,55,0.18)",warning:"rgba(186,117,23,0.15)",info:"rgba(24,95,165,0.12)",none:"var(--color-background-primary)"};
    const strMap={danger:"var(--color-border-danger)",warning:"var(--color-border-warning)",info:"var(--color-border-info)",none:"var(--color-border-secondary)"};
    const prio=(PRIORITY_TABLE[id]||[]).map(b=>b[0]).join(">");
    const emp=SECTOR_EMPRESA[id]||"";
    // Saldo SÓ aparece se já tiver sido consultado de verdade no Fabric
    // (via aba Auditoria/Bridge). Sem consulta real, mostra "—" — nunca um
    // número inventado.
    const infoSaldo=STATE.saldosReais[emp];
    const saldoLabel=infoSaldo && infoSaldo.saldo!=null ? `${infoSaldo.saldo}tk` : "—";
    const saldoColor=!infoSaldo?"var(--color-text-tertiary)":(infoSaldo.saldo<10?"var(--color-text-danger)":infoSaldo.saldo<50?"var(--color-text-warning)":"var(--color-text-tertiary)");
    sectors+=`<g>
      <rect x="${x}" y="${y}" width="${sW}" height="${sH}" rx="5" fill="${fillMap[fl]}" stroke="${strMap[fl]}" stroke-width="0.5"/>
      <text x="${x+sW/2}" y="${y+16}" text-anchor="middle" style="font-size:12px;font-weight:500;font-family:var(--font-mono)" fill="var(--color-text-primary)">${id}</text>
      <text x="${x+sW/2}" y="${y+27}" text-anchor="middle" style="font-size:7px;font-family:var(--font-mono)" fill="var(--color-text-tertiary)">${prio}</text>
      <text x="${x+sW/2}" y="${y+40}" text-anchor="middle" style="font-size:8px;font-family:var(--font-mono)" fill="${saldoColor}">${saldoLabel}</text>
      ${p>0?`<circle cx="${x+sW-9}" cy="${y+9}" r="8" fill="${fl==="danger"?"rgba(209,55,55,0.3)":"rgba(186,117,23,0.3)"}" stroke="${strMap[fl]}" stroke-width="0.5"/>
      <text x="${x+sW-9}" y="${y+9}" text-anchor="middle" dominant-baseline="central" style="font-size:8px;font-weight:500;font-family:var(--font-mono)" fill="${fl==="danger"?"var(--color-text-danger)":"var(--color-text-warning)"}">${p}</text>`:""}
      ${a?`<circle cx="${x+9}" cy="${y+9}" r="5" fill="rgba(24,95,165,0.3)" stroke="var(--color-border-info)" stroke-width="0.5"/>
      <text x="${x+9}" y="${y+9}" text-anchor="middle" dominant-baseline="central" style="font-size:7px" fill="var(--color-text-info)">A</text>`:""}
    </g>`;
  });
  const bases=["NORTE","SUL","LESTE","OESTE"];
  let baseLabels="";
  bases.forEach(base=>{
    const online=STATE.bases[base];
    const drs=STATE.drones.filter(d=>d.base===base);
    const free=drs.filter(d=>d.state==="LIVRE").length;
    const lost=drs.filter(d=>d.state==="PERDIDO").length;
    const col=!online?"var(--color-text-danger)":lost>0?"var(--color-text-danger)":free>0?"var(--color-text-success)":"var(--color-text-warning)";
    let bx,by,anchor="middle";
    if(base==="NORTE"){bx=totalW/2;by=13;}
    else if(base==="SUL"){bx=totalW/2;by=totalH-4;}
    else if(base==="OESTE"){bx=3;by=totalH/2-5;anchor="start";}
    else{bx=totalW-3;by=totalH/2-5;anchor="end";}
    const label=online?`${base} [${free}/${drs.length}]`:`${base} ✕OFFLINE`;
    baseLabels+=`<text x="${bx}" y="${by}" text-anchor="${anchor}" style="font-size:8px;font-weight:500;font-family:var(--font-mono)" fill="${col}">${label}</text>`;
    drs.forEach((drone,i)=>{
      const stC=!online?"var(--color-text-danger)":c_state(drone.state);
      const op=(!online||drone.state==="PERDIDO")?0.25:1;
      let dx,dy;
      if(base==="NORTE"){dx=totalW/2-((drs.length-1)*8)+i*16;dy=20;}
      else if(base==="SUL"){dx=totalW/2-((drs.length-1)*8)+i*16;dy=totalH-14;}
      else if(base==="OESTE"){dx=12;dy=totalH/2-((drs.length-1)*7)+i*14;}
      else{dx=totalW-12;dy=totalH/2-((drs.length-1)*7)+i*14;}
      dronePts+=`<polygon points="${dx},${dy-5} ${dx-5},${dy+4} ${dx+5},${dy+4}" fill="${stC}" opacity="${op}" stroke="none"/>`;
    });
  });
  return `<svg width="100%" viewBox="0 0 ${totalW} ${totalH}" style="display:block">
    ${baseLabels}${sectors}${dronePts}
  </svg>`;
}

          ${d.state==="PERDIDO"&&bOn?`<button onclick="reviveDrone('${d.id}')" style="font-size:11px;color:var(--color-text-success)">Reconectar</button>`:""}
          ${d.state==="LIVRE"&&bOn?`<button onclick="killDrone('${d.id}')" style="font-size:11px;color:var(--color-text-danger)">Derrubar</button>`:""}
          ${d.state!=="OCUPADO"?`<button onclick="removeDrone('${d.id}')" style="font-size:11px">Remover</button>`:""}
          ${d.state==="OCUPADO"?`<span style="font-size:11px;color:var(--color-text-warning)">Em missão</span>`:""}
        </div>
      </div>`;
    }).join("")}`;

  if(STATE.tab==="audit") return renderAuditoria();

  if(STATE.tab==="bridge") return `
    <p style="margin:0 0 10px;font-size:12px;color:var(--color-text-secondary)">Conecte ao sistema Python real. O broker envia eventos UDP na porta 8000 via <span class="mono">notificar_monitor()</span>. A bridge bidirecional também encaminha chamadas ao Hyperledger Fabric — é a ÚNICA fonte de dados financeiros usada na aba Auditoria.</p>
    <div style="margin-bottom:8px"><label style="font-size:12px;color:var(--color-text-secondary);display:block;margin-bottom:4px">URL WebSocket</label>
    <input type="text" value="${STATE.wsUrl}" oninput="STATE.wsUrl=this.value"></div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
      <div style="width:8px;height:8px;border-radius:50%;background:${STATE.wsStatus==="connected"?"var(--color-text-success)":STATE.wsStatus==="error"?"var(--color-text-danger)":"var(--color-text-tertiary)"}"></div>
      <span style="font-size:12px;color:var(--color-text-secondary)">${STATE.wsStatus==="connected"?"Conectado ao sistema real":STATE.wsStatus==="error"?"Erro de conexão":"Desconectado (modo simulação de fila/prioridade apenas)"}</span>
    </div>
    <button onclick="${STATE.wsStatus==="connected"?"STATE.wsObj&&STATE.wsObj.close()":"connectWs()"}" style="width:100%;padding:9px;font-weight:500;margin-bottom:12px;background:${STATE.wsStatus==="connected"?"var(--color-background-danger)":"var(--color-background-success)"};color:${STATE.wsStatus==="connected"?"var(--color-text-danger)":"var(--color-text-success)"};border-color:transparent">
      ${STATE.wsStatus==="connected"?"Desconectar":"Conectar ao Sistema Real"}
    </button>
    <div style="font-size:12px;font-weight:500;margin-bottom:6px">monitor_bridge.py (versão bidirecional com Fabric):</div>
    <div style="background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:10px">
<pre># Execute: python monitor/monitor_bridge.py
# Requer: pip install websockets
# A versao bidirecional encaminha chamadas
# GET_SALDO / GET_AUDITORIA / TRANSFERIR
# direto para o Hyperledger Fabric via ledger_client.py</pre></div>`;

  return "";
}

// ─── RENDER principal ──────────────────────────────────────────────────────
function render() {
  const S=STATE;
  S.lamport=lamportClock;

  const qSorted=[...S.queue].sort((a,b)=>{
    const ord={PENDENTE:0,ACEITA:1,CONCLUIDA:2};
    if(ord[a.status]!==ord[b.status]) return ord[a.status]-ord[b.status];
    return (CRIT_PESO[b.crit]||1)-(CRIT_PESO[a.crit]||1);
  }).slice(0,30);

  const pendN=S.queue.filter(r=>r.status==="PENDENTE").length;
  const actN=S.queue.filter(r=>r.status==="ACEITA").length;
  const freeN=S.drones.filter(d=>d.state==="LIVRE"&&S.bases[d.base]).length;
  const onlineBases=Object.values(S.bases).filter(Boolean).length;
  const conectado = S.wsStatus === "connected";

  const tabs=[
    {k:"inject",l:"Injetar Alerta"},
    {k:"stress",l:"Stress Test"},
    {k:"drone",l:"Drones & Bases"},
    {k:"audit",l:"📊 Auditoria"},
    {k:"bridge",l:"Bridge"}
  ];

  document.getElementById("app").innerHTML = `
  <div style="display:flex;align-items:flex-start;justify-content:space-between;padding:10px 0 14px;border-bottom:0.5px solid var(--color-border-tertiary);margin-bottom:14px;flex-wrap:wrap;gap:8px">
    <div>
      <div class="mono" style="font-size:17px;font-weight:500;color:var(--color-text-primary)">ORMUZ COMMAND CENTER</div>
      <div style="font-size:11px;color:var(--color-text-secondary);margin-top:2px">Infraestrutura distribuída — monitoramento marítimo + economia em blockchain</div>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      ${[
        {l:"LAMPORT",v:S.lamport,c:"var(--color-text-primary)"},
        {l:"ALERTAS",v:S.stats.total,c:"var(--color-text-primary)"},
        {l:"ACEITAS",v:S.stats.aceitas,c:"var(--color-text-info)"},
        {l:"CONCLUÍDAS",v:S.stats.concluidas,c:"var(--color-text-success)"},
        {l:"BASES OK",v:`${onlineBases}/4`,c:onlineBases===4?"var(--color-text-success)":onlineBases===0?"var(--color-text-danger)":"var(--color-text-warning)"},
      ].map(x=>`<div style="background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:5px 10px;text-align:center;min-width:60px">
        <div style="font-size:9px;color:var(--color-text-tertiary);margin-bottom:2px">${x.l}</div>
        <div class="mono" style="font-size:18px;font-weight:500;color:${x.c};line-height:1">${x.v}</div>
      </div>`).join("")}
      <div style="background:${conectado?"var(--color-background-success)":"var(--color-background-secondary)"};border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:5px 10px;text-align:center;cursor:pointer" onclick="STATE.tab='bridge';render()">
        <div style="font-size:9px;color:var(--color-text-tertiary);margin-bottom:2px">STATUS</div>
        <div class="mono" style="font-size:12px;font-weight:500;color:${conectado?"var(--color-text-success)":S.wsStatus==="error"?"var(--color-text-danger)":"var(--color-text-warning)"}">${conectado?"REAL":S.wsStatus==="error"?"ERRO":"OFFLINE"}</div>
      </div>
    </div>
  </div>

  <div style="margin-bottom:14px;padding:9px 12px;border-radius:var(--border-radius-md);font-size:11px;
    background:${conectado?"var(--color-background-success)":"var(--color-background-warning)"};
    border:0.5px solid ${conectado?"var(--color-border-success)":"var(--color-border-warning)"};
    color:${conectado?"var(--color-text-success)":"var(--color-text-warning)"}">
    ${conectado
      ? "🔗 Bridge conectada — a aba 📊 Auditoria mostra saldos, transferências e histórico REAIS do Hyperledger Fabric."
      : "🧪 Mapa tático, fila e drones abaixo são uma simulação OFFLINE do algoritmo de prioridade/timeout — não tocam o ledger e não inventam saldo. Para ver dados financeiros reais, conecte a Bridge."}
  </div>

  <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:12px">

    <!-- Coluna 1: mapa + drones + tabela de prioridades -->
    <div style="display:flex;flex-direction:column;gap:10px">

      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <span style="font-size:13px;font-weight:500">Mapa Tático</span>
          <div style="display:flex;gap:4px">
            <span class="badge" style="background:${pendN>0?"var(--color-background-warning)":"var(--color-background-secondary)"};color:${pendN>0?"var(--color-text-warning)":"var(--color-text-tertiary)"};border-color:transparent">${pendN} pend.</span>
            <span class="badge" style="background:var(--color-background-info);color:var(--color-text-info);border-color:transparent">${actN} ativas</span>
          </div>
        </div>
        ${renderMap()}
        <div style="margin-top:4px;font-size:9px;color:var(--color-text-tertiary)">Saldo só aparece após consulta real no Fabric (aba Auditoria) · ▲ = drones</div>
      </div>

      <div class="card">
        <div style="font-size:13px;font-weight:500;margin-bottom:8px">
          Frota de Drones
          <span style="font-size:11px;font-weight:400;color:var(--color-text-secondary);margin-left:6px">${freeN} livres / ${S.drones.length} total</span>
        </div>
        ${S.drones.map(renderDroneCard).join("")}
      </div>

      <div class="card">
        <div style="font-size:13px;font-weight:500;margin-bottom:8px">Tabela de Prioridades por Setor</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px">
          ${Object.entries(PRIORITY_TABLE).map(([s,o])=>`<div style="padding:5px 8px;background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);font-size:10px">
            <span class="mono" style="font-weight:500">${s}</span>: ${o.map((b,i)=>`<span style="color:${i===0?"var(--color-text-success)":!STATE.bases[b]?"var(--color-text-danger)":"var(--color-text-tertiary)"}">${i>0?" > ":""}${b[0]}${!STATE.bases[b]?"✕":""}</span>`).join("")}
          </div>`).join("")}
        </div>
      </div>
    </div>

    <!-- Coluna 2: fila + log de eventos -->
    <div style="display:flex;flex-direction:column;gap:10px">
      <div class="card" style="flex:none">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <span style="font-size:13px;font-weight:500">Fila Distribuída Replicada</span>
          <button onclick="STATE.queue=[];render()" style="font-size:11px;padding:3px 8px">Limpar</button>
        </div>
        <div style="font-size:11px;color:var(--color-text-secondary);margin-bottom:8px">
          Ordem: criticidade (CRITICA→ALTA→BAIXA) → timestamp Lamport → setor
        </div>
        <div class="scroll" style="max-height:260px">
          ${qSorted.length===0
            ?`<div style="text-align:center;padding:28px 0;color:var(--color-text-tertiary);font-size:13px">Fila vazia — aguardando alertas</div>`
            :qSorted.map(renderQueueItem).join("")}
        </div>
      </div>

      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <span style="font-size:13px;font-weight:500">Log de Eventos</span>
          <button onclick="STATE.events=[];render()" style="font-size:11px;padding:3px 8px">Limpar</button>
        </div>
        <div class="scroll mono" style="max-height:320px;font-size:10px;line-height:1.7">
          ${S.events.slice(0,80).map(ev=>`<div style="display:flex;gap:8px;padding:1px 0;border-bottom:0.5px solid var(--color-border-tertiary)22">
            <span style="color:var(--color-text-tertiary);flex-shrink:0">${ev.ts}</span>
            <span style="color:${c_log(ev.level)}">${ev.msg}</span>
          </div>`).join("")}
          ${S.events.length===0?`<div style="color:var(--color-text-tertiary);padding:8px 0">Aguardando eventos...</div>`:""}
        </div>
      </div>
    </div>

    <!-- Coluna 3: painel de controle com 5 abas -->
    <div style="display:flex;flex-direction:column;gap:10px">
      <div class="card">
        <div style="display:grid;grid-template-columns:repeat(5,1fr);margin:-12px -12px 12px;border-bottom:0.5px solid var(--color-border-tertiary)">
          ${tabs.map(t=>`<button onclick="STATE.tab='${t.k}';render()" style="padding:8px 2px;font-size:10px;font-weight:${S.tab===t.k?500:400};background:${S.tab===t.k?"var(--color-background-primary)":"transparent"};border:none;border-radius:0;border-bottom:${S.tab===t.k?"2px solid var(--color-text-info)":"2px solid transparent"};color:${S.tab===t.k?"var(--color-text-primary)":"var(--color-text-secondary)"};cursor:pointer;transition:all 0.15s">${t.l}</button>`).join("")}
        </div>
        ${renderTabContent()}
      </div>
    </div>
  </div>`;
}

// Expõe globalmente para os handlers onclick
window.STATE=STATE;
window.render=render;
window.injectAlert=injectAlert;
window.startBombard=startBombard;
window.stopBombard=stopBombard;
window.addDrone=addDrone;
window.killDrone=killDrone;
window.reviveDrone=reviveDrone;
window.removeDrone=removeDrone;
window.connectWs=connectWs;
window.processQueue=processQueue;
window.killBase=killBase;
window.reviveBase=reviveBase;
window.chamarFabric=chamarFabric;
window.EMPRESAS=EMPRESAS;

// INIT
log("Sistema ORMUZ COMMAND CENTER iniciado","success");
log("4 bases ativas: NORTE, SUL, LESTE, OESTE","info");
log("4 drones registrados e prontos","info");
log("Modo OFFLINE: fila/prioridade/timeout simulados localmente — nenhum dado financeiro é inventado","warn");
log("Conecte a aba Bridge para ver saldos, transferências e auditoria reais do Hyperledger Fabric","info");

render();
startAutoSim();
})();
</script>
</body>
</html>
