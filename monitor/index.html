<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ormuz Command Center</title>
    <style>
    * { box-sizing: border-box; }
    body { margin: 0; background-color: #1e1e1e; color: #e0e0e0; }
    :root {
      --color-background-primary: #121212;
      --color-background-secondary: #1e1e1e;
      --color-background-success: #1b3320;
      --color-background-warning: #332711;
      --color-background-danger: #331414;
      --color-background-info: #11263d;
      --color-border-primary: #555;
      --color-border-secondary: #333;
      --color-border-tertiary: #222;
      --color-border-success: #2ea043;
      --color-border-warning: #d29922;
      --color-border-danger: #f85149;
      --color-border-info: #388bfd;
      --color-text-primary: #e6edf3;
      --color-text-secondary: #8b949e;
      --color-text-tertiary: #6e7681;
      --color-text-success: #3fb950;
      --color-text-warning: #d29922;
      --color-text-danger: #f85149;
      --color-text-info: #58a6ff;
      --border-radius-md: 4px;
      --border-radius-lg: 8px;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }
    select, input[type=text], input[type=number] {
      width: 100%; padding: 6px 10px; font-size: 12px;
      background: var(--color-background-primary);
      color: var(--color-text-primary);
      border: 0.5px solid var(--color-border-secondary);
      border-radius: var(--border-radius-md);
      font-family: var(--font-sans); margin: 0;
    }
    select:focus, input:focus { outline: none; border-color: var(--color-border-primary); }
    button {
      background: transparent; border: 0.5px solid var(--color-border-secondary);
      color: var(--color-text-secondary); border-radius: var(--border-radius-md);
      cursor: pointer; font-family: var(--font-sans); font-size: 12px;
      padding: 7px 12px; transition: background 0.15s, color 0.15s;
    }
    button:hover { background: var(--color-background-secondary); color: var(--color-text-primary); }
    button:disabled { opacity: 0.45; cursor: default; }
    input[type=range] { width: 100%; accent-color: var(--color-text-info); }
    input[type=checkbox] { accent-color: var(--color-text-info); cursor: pointer; }
    .card { background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 12px; }
    .mono { font-family: var(--font-mono); }
    .badge { font-size: 10px; padding: 2px 7px; border-radius: var(--border-radius-md); font-family: var(--font-mono); font-weight: 500; border: 0.5px solid; }
    .scroll { overflow-y: auto; scrollbar-width: thin; }
    pre { margin: 0; white-space: pre-wrap; font-family: var(--font-mono); font-size: 10px; color: var(--color-text-secondary); line-height: 1.6; }
    </style>
</head>
<body>
<div id="app" style="font-family:var(--font-sans);padding:1rem"></div>
<script>
(function() {
const PRIORITY_TABLE = {
  S1:["NORTE","OESTE","LESTE","SUL"], S2:["SUL","LESTE","OESTE","NORTE"],
  S3:["LESTE","NORTE","SUL","OESTE"], S4:["OESTE","NORTE","SUL","LESTE"],
  S5:["NORTE","LESTE","SUL","OESTE"], S6:["LESTE","NORTE","SUL","OESTE"],
  S7:["NORTE","SUL","LESTE","OESTE"], S8:["LESTE","SUL","NORTE","OESTE"]
};
const CRIT_PESO = {CRITICA:3, ALTA:2, BAIXA:1};
const TIPO_CRIT = {
  embarcacao_perigo:"CRITICA", bloqueio_rota:"ALTA",
  objeto_nao_identificado:"ALTA", embarcacao_deriva:"BAIXA",
  falha_sinalizacao:"BAIXA", anomalia_menor:"BAIXA"
};
const TIPOS = Object.keys(TIPO_CRIT);
const TIMEOUT_MS = {1:0,2:200,3:400,4:600};
const SECTOR_LAYOUT = [
  {id:"S1",col:0,row:0},{id:"S2",col:1,row:0},{id:"S5",col:2,row:0},{id:"S6",col:3,row:0},
  {id:"S3",col:0,row:1},{id:"S4",col:1,row:1},{id:"S7",col:2,row:1},{id:"S8",col:3,row:1}
];

// ── Economia e Auditoria (espelha o chaincode token_contrato.go) ────────────
// Cada setor pertence a uma empresa — mesmo mapeamento do docker/.env
const SECTOR_EMPRESA = {
  S1:"EMPRESA-A", S2:"EMPRESA-B", S3:"EMPRESA-C", S4:"EMPRESA-D",
  S5:"EMPRESA-E", S6:"EMPRESA-F", S7:"EMPRESA-G", S8:"EMPRESA-H"
};
const EMPRESAS = Object.values(SECTOR_EMPRESA);
// Custo em tokens por criticidade — espelha config/custo_por_criticidade.json
const CUSTO_POR_CRIT = {CRITICA:3, ALTA:2, BAIXA:1};
const SALDO_INICIAL_EMPRESA = 200; // mesmo valor de fabric/init_ledger.sh

let _uid=0;
const uid = () => `R${++_uid}`;
let lamportClock = 0;
const incLamport = () => ++lamportClock;

let STATE = {
  drones: [
    {id:"DRONE-NORTE-1",base:"NORTE",state:"LIVRE",mission:null,port:7001},
    {id:"DRONE-SUL-1",base:"SUL",state:"LIVRE",mission:null,port:7011},
    {id:"DRONE-LESTE-1",base:"LESTE",state:"LIVRE",mission:null,port:7021},
    {id:"DRONE-OESTE-1",base:"OESTE",state:"LIVRE",mission:null,port:7031}
  ],
  bases: {NORTE:true, SUL:true, LESTE:true, OESTE:true},
  queue: [],
  events: [],
  lamport: 0,
  tab: "inject",
  stats: {total:0, aceitas:0, concluidas:0, perdidos:0, rejeitados:0},
  bombarding: false, bombSent:0, bombTotal:0,
  bombCfg: {count:20,rate:3,sectors:"all",criticidade:"mixed"},
  newDrone: {id:"",base:"NORTE",port:7100},
  injectForm: {sector:"S1",tipo:"embarcacao_perigo"},
  autoSim: true,
  wsUrl: "ws://localhost:8001",
  wsStatus: "sim",
  wsObj: null,
  // ── Ledger financeiro (espelha chaincode) ────────────────────────────────
  carteiras: Object.fromEntries(EMPRESAS.map(e=>[e, SALDO_INICIAL_EMPRESA])),
  ledger: [],          // cadeia de blocos (mais recente primeiro)
  ledgerOk: null,      // null=não verificado / true=ok / false=adulterado
  auditFiltroEmpresa: "TODAS",
  auditFiltroTipo: "TODOS",
  transferForm: {origem:"EMPRESA-A", destino:"EMPRESA-B", valor:20}
};

let bombTimer = null;
let autoSimTimer = null;

// ── Hash encadeado (FNV-1a 32-bit) ─────────────────────────────────────────
// Simula o encadeamento de blocos da blockchain: cada bloco guarda o hash do
// bloco anterior. Qualquer adulteração do conteúdo quebra a cadeia.
function hashSimples(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return (h >>> 0).toString(16).padStart(8,"0");
}

function corpoCanonicoLedger(entry) {
  // Exclui metadados de controle — só os dados de negócio entram no hash
  const {id, ts, hash, hashAnterior, integro, ...dados} = entry;
  return JSON.stringify(dados);
}

function calcularHashLedger(entry, hashAnteriorRef) {
  return hashSimples(corpoCanonicoLedger(entry) + "|" + hashAnteriorRef);
}

// Registra um novo bloco encadeado ao hash do anterior (o mais recente está em [0])
function registrarLedger(tipo, dados) {
  const ts = new Date().toLocaleTimeString("pt-BR",{hour12:false});
  const hashAnterior = STATE.ledger.length ? STATE.ledger[0].hash : "00000000";
  const entry = {id:uid(), tipo, ts, ...dados, hashAnterior, integro:true};
  entry.hash = calcularHashLedger(entry, hashAnterior);
  STATE.ledger.unshift(entry);
  if(STATE.ledger.length > 500) STATE.ledger.length = 500;
  STATE.ledgerOk = null; // invalida verificação anterior
  return entry;
}

// Percorre do bloco mais antigo ao mais recente e recomputa os hashes para
// detectar adulterações — igual ao que o Hyperledger Fabric faz internamente
// com o encadeamento de blocos no canal.
function verificarIntegridadeLedger() {
  const cronologico = [...STATE.ledger].reverse();
  let anterior = "00000000";
  let violacoes = 0;
  cronologico.forEach(entry => {
    const hashEsperado = calcularHashLedger(entry, entry.hashAnterior);
    const ligacaoOk   = entry.hashAnterior === anterior;
    const dadosOk     = hashEsperado === entry.hash;
    entry.integro     = ligacaoOk && dadosOk;
    if(!entry.integro) violacoes++;
    anterior = entry.hash;
  });
  STATE.ledgerOk = violacoes === 0;
  if(violacoes === 0) {
    log(`✓ Integridade verificada: ${cronologico.length} blocos, nenhuma adulteração`,"success");
  } else {
    log(`⚠ ADULTERAÇÃO DETECTADA: ${violacoes} bloco(s) com hash inválido na cadeia!`,"warn");
  }
  render();
}

// Simula um nó malicioso editando o conteúdo de um bloco SEM recalcular o
// hash — exatamente o ataque descrito no barema ("alterar manualmente um
// registro na cópia local de um nó"). O botão de verificação depois detecta.
function simularAdulteracaoLedger() {
  if(STATE.ledger.length === 0) {
    log("Nenhum bloco no ledger para adulterar ainda.","warn");
    render();
    return;
  }
  // Escolhe um bloco aleatório (prefere LAUDO ou AUTORIZACAO para ser mais dramático)
  const candidatos = STATE.ledger.filter(e=>e.tipo==="LAUDO"||e.tipo==="AUTORIZACAO");
  const alvo = candidatos.length ? candidatos[Math.floor(Math.random()*candidatos.length)]
                                 : STATE.ledger[Math.floor(Math.random()*STATE.ledger.length)];
  const tipoAlvo = alvo.tipo;
  if(alvo.custo  !== undefined) alvo.custo  = 9999;
  else if(alvo.valor !== undefined) alvo.valor = 9999;
  else if(alvo.drone !== undefined) alvo.drone = "DRONE-FALSIFICADO";
  else alvo.motivo = "(dado adulterado para teste)";
  alvo.integro = undefined;
  log(`🧪 Adulteração simulada no bloco ${alvo.id} [${tipoAlvo}] — hash NÃO foi recalculado. Clique em "Verificar Integridade" para provar que a rede detecta.`,"warn");
  render();
}

// Recarga geral de carteiras (equivale a rodar init_ledger.sh novamente)
function recarregarCarteiras() {
  EMPRESAS.forEach(e => { STATE.carteiras[e] = SALDO_INICIAL_EMPRESA; });
  registrarLedger("GENESE", {
    empresa:"TODAS",
    valor: SALDO_INICIAL_EMPRESA,
    motivo:`Recarga geral — ${EMPRESAS.length} carteiras restauradas para ${SALDO_INICIAL_EMPRESA} tokens`
  });
  log(`↺ Todas as carteiras recarregadas para ${SALDO_INICIAL_EMPRESA} tokens`,"success");
  render();
}

// TransferirTokens — espelha o chaincode Go
function transferirTokens(origem, destino, valor) {
  valor = Number(valor);
  if(!valor || valor <= 0) { log("Valor de transferência inválido.","warn"); render(); return; }
  if(origem === destino)   { log("Origem e destino devem ser diferentes.","warn"); render(); return; }
  const saldoOrigem = STATE.carteiras[origem] ?? 0;
  if(saldoOrigem < valor) {
    registrarLedger("TRANSFERENCIA_NEGADA", {empresa:origem, destino, valor,
      motivo:`Saldo insuficiente (necessário ${valor}tk, disponível ${saldoOrigem}tk)`});
    log(`✕ Transferência negada: ${origem} não tem saldo suficiente para enviar ${valor}tk a ${destino}`,"warn");
    render();
    return;
  }
  STATE.carteiras[origem] -= valor;
  STATE.carteiras[destino] = (STATE.carteiras[destino]||0) + valor;
  registrarLedger("TRANSFERENCIA", {
    empresa:origem, destino, valor,
    saldoOrigem: STATE.carteiras[origem],
    saldoDestino: STATE.carteiras[destino]
  });
  log(`💸 Transferência: ${origem} → ${destino} | ${valor} tokens | Novo saldo: ${STATE.carteiras[origem]}tk`,"success");
  render();
}

// ── Fila e prioridade ───────────────────────────────────────────────────────
function sortByPriority(q) {
  return [...q].sort((a,b)=>{
    const pa=CRIT_PESO[a.crit]||1, pb=CRIT_PESO[b.crit]||1;
    if(pb!==pa) return pb-pa;
    if(a.ts!==b.ts) return a.ts-b.ts;
    return a.sector.localeCompare(b.sector);
  });
}

function log(msg, level="info") {
  const ts = new Date().toLocaleTimeString("pt-BR",{hour12:false});
  STATE.events.unshift({id:uid(),ts,msg,level});
  if(STATE.events.length>200) STATE.events.length=200;
}

// ── processQueue com pagamento antes do despacho (AutorizarPagamento) ───────
// Garante anti-duplo-gasto: o saldo é debitado do ledger ANTES do drone ser
// ocupado. Se não houver saldo, a requisição é REJEITADA (estado terminal).
function processQueue() {
  const pending = STATE.queue.filter(r=>r.status==="PENDENTE");
  if(!pending.length) return;
  const sorted = sortByPriority(pending);
  const free = STATE.drones.find(d=>d.state==="LIVRE" && STATE.bases[d.base]);
  if(!free) return;

  for (const req of sorted) {
    const custo = CUSTO_POR_CRIT[req.crit] || 1;
    const empresa = req.empresa || SECTOR_EMPRESA[req.sector] || "EMPRESA-A";
    const saldo = STATE.carteiras[empresa] ?? 0;

    if(saldo < custo) {
      // Pagamento negado — ANTES de ocupar o drone
      req.status = "REJEITADA";
      STATE.stats.rejeitados++;
      registrarLedger("REJEICAO", {
        empresa, requisicao:req.id, custo, saldo,
        motivo:`Saldo insuficiente (necessário ${custo}tk, disponível ${saldo}tk)`
      });
      log(`✕ Pagamento NEGADO | req ${req.id} (${req.sector}) | ${empresa} precisa de ${custo}tk, tem ${saldo}tk — drone NÃO despachado`,"warn");
      continue;
    }

    // Autorizar pagamento — débito imediato no ledger
    STATE.carteiras[empresa] -= custo;
    registrarLedger("AUTORIZACAO", {
      empresa, requisicao:req.id, custo,
      saldoRestante: STATE.carteiras[empresa]
    });

    const ts = lamportClock;
    req.status = "ACEITA";
    req.drone  = free.id;
    free.state = "OCUPADO";
    free.mission = req.id;
    log(`[${free.base}] Aceitou ${req.id} → ${free.id.replace("DRONE-","")} | ${empresa} debitou ${custo}tk (restam ${STATE.carteiras[empresa]}tk) | L=${ts}`,"success");
    STATE.stats.aceitas++;

    const dur = 8000 + Math.random()*12000;
    const capturedDrone = free;
    const capturedReq   = req;
    setTimeout(()=>{
      if(capturedDrone.state === "OCUPADO") {
        capturedDrone.state = "LIVRE";
        capturedDrone.mission = null;
        capturedReq.status = "CONCLUIDA";
        STATE.stats.concluidas++;
        // RegistrarLaudo — laudo imutável, nenhum token é movido
        registrarLedger("LAUDO", {
          empresa:capturedReq.empresa || SECTOR_EMPRESA[capturedReq.sector],
          requisicao: capturedReq.id,
          drone: capturedDrone.id,
          setor: capturedReq.sector,
          tipo: capturedReq.tipo,
          criticidade: capturedReq.crit
        });
        log(`✓ Missão ${capturedReq.id} concluída por ${capturedDrone.id.replace("DRONE-","")} — laudo registrado no ledger`,"success");
        setTimeout(processQueue,100);
        render();
      }
    }, dur);
    render();
    return;
  }
  render();
}

function injectAlert(sector, tipo, crit) {
  const ts = incLamport();
  const id = uid();
  const empresa = SECTOR_EMPRESA[sector] || "EMPRESA-A";
  const req = {id, sector, tipo, crit, ts, status:"PENDENTE", drone:null, empresa};
  const lvl = crit==="CRITICA"?"critica":crit==="ALTA"?"alta":"info";
  log(`ALERTA ${sector} [${empresa}] | ${tipo.replace(/_/g," ")} [${crit}] | L=${ts}`,lvl);
  STATE.stats.total++;
  STATE.queue.push(req);
  STATE.queue = sortByPriority(STATE.queue);
  STATE.lamport = lamportClock;
  const order = PRIORITY_TABLE[sector]||["NORTE","SUL","LESTE","OESTE"];
  const onlineOrder = order.filter(b=>STATE.bases[b]);
  const pos = onlineOrder.length > 0 ? 1 : 4;
  const tmo = TIMEOUT_MS[pos]??600;
  setTimeout(()=>{ processQueue(); render(); }, tmo+50);
  render();
}

function startBombard() {
  STATE.bombarding=true; STATE.bombSent=0; STATE.bombTotal=STATE.bombCfg.count;
  log(`BOMBARDEAMENTO: ${STATE.bombCfg.count} alertas @ ${STATE.bombCfg.rate}/s`,"warn");
  let sent=0; const total=STATE.bombCfg.count;
  const interval=Math.max(50,1000/STATE.bombCfg.rate);
  const fire=()=>{
    if(sent>=total){STATE.bombarding=false;log(`Bombardeamento concluido: ${total} alertas`,"info");render();return;}
    const sAll=["S1","S2","S3","S4","S5","S6","S7","S8"];
    const s=STATE.bombCfg.sectors==="all"?sAll[Math.floor(Math.random()*8)]:STATE.bombCfg.sectors;
    let c; const r=Math.random();
    if(STATE.bombCfg.criticidade==="mixed") c=r<0.2?"CRITICA":r<0.5?"ALTA":"BAIXA";
    else c=STATE.bombCfg.criticidade;
    const t=TIPOS[Math.floor(Math.random()*TIPOS.length)];
    injectAlert(s,t,c);
    sent++; STATE.bombSent=sent;
    bombTimer=setTimeout(fire,interval);
    render();
  };
  fire();
}

function stopBombard() {
  if(bombTimer) clearTimeout(bombTimer);
  STATE.bombarding=false;
  log("Bombardeamento interrompido","warn");
  render();
}

function addDrone() {
  const nd=STATE.newDrone;
  if(!nd.id.trim()) return;
  STATE.drones.push({id:nd.id.trim(),base:nd.base,state:"LIVRE",mission:null,port:nd.port});
  log(`Drone ${nd.id} adicionado a base ${nd.base}`,"success");
  STATE.newDrone={id:"",base:nd.base,port:nd.port+10};
  setTimeout(()=>{processQueue();render();},200);
  render();
}

function killDrone(droneId) {
  const d=STATE.drones.find(x=>x.id===droneId);
  if(!d) return;
  d.state="PERDIDO";
  log(`Drone ${droneId.replace("DRONE-","")} marcado PERDIDO`,"warn");
  STATE.stats.perdidos++;
  if(d.mission){
    const req=STATE.queue.find(r=>r.id===d.mission);
    if(req){req.status="PENDENTE";req.drone=null;}
    log(`Missao ${d.mission} devolvida a fila`,"info");
    d.mission=null;
    setTimeout(()=>{processQueue();render();},300);
  }
  render();
}

function reviveDrone(droneId) {
  const d=STATE.drones.find(x=>x.id===droneId);
  if(!d) return;
  if(!STATE.bases[d.base]) {
    log(`Drone ${droneId.replace("DRONE-","")} não pode reviver — base ${d.base} offline`,"warn");
    render(); return;
  }
  d.state="LIVRE"; d.mission=null;
  log(`Drone ${droneId.replace("DRONE-","")} reconectado`,"success");
  setTimeout(()=>{processQueue();render();},200);
  render();
}

function removeDrone(droneId) {
  STATE.drones=STATE.drones.filter(d=>d.id!==droneId);
  log(`Drone ${droneId.replace("DRONE-","")} removido`,"warn");
  render();
}

function killBase(baseId) {
  if(!STATE.bases[baseId]) return;
  STATE.bases[baseId] = false;
  STATE.drones.filter(d=>d.base===baseId && d.state!=="PERDIDO").forEach(d=>{
    d.state="PERDIDO"; STATE.stats.perdidos++;
    if(d.mission){
      const req=STATE.queue.find(r=>r.id===d.mission);
      if(req){req.status="PENDENTE";req.drone=null;}
      log(`Missao ${d.mission} devolvida — base ${baseId} caiu`,"info");
      d.mission=null;
    }
  });
  log(`⚠ Base ${baseId} DESATIVADA — todos os drones offline`,"warn");
  setTimeout(()=>{processQueue();render();},300);
  render();
}

function reviveBase(baseId) {
  if(STATE.bases[baseId]) return;
  STATE.bases[baseId] = true;
  STATE.drones.filter(d=>d.base===baseId && d.state==="PERDIDO")
    .forEach(d=>{d.state="LIVRE"; d.mission=null;});
  log(`✔ Base ${baseId} RESTAURADA — drones reconectados`,"success");
  setTimeout(()=>{processQueue();render();},200);
  render();
}

function connectWs() {
  try {
    const ws=new WebSocket(STATE.wsUrl);
    ws.onopen=()=>{STATE.wsStatus="connected";log(`Conectado: ${STATE.wsUrl}`,"success");render();};
    ws.onmessage=(e)=>{
      try{
        const m=JSON.parse(e.data);
        if(m.tipo==="DRONE_DESPACHADO") log(`[${m.base}] ${m.drone} → Setor ${m.setor}`,"success");
        else if(m.tipo==="MISSAO_CONCLUIDA") log(`Missão concluída: drone ${m.drone}`,"success");
        else if(m.tipo==="ALERTA_GERADO") injectAlert(m.setor, m.tipo_ocorrencia||"anomalia_menor", m.criticidade);
        else if(m.tipo==="PAGAMENTO_RECUSADO") log(`✕ Pagamento recusado pelo ledger real: ${m.motivo}`,"warn");
        // Resposta da bridge para consultas ao Fabric real
        else if(m.tipo_resposta==="SALDO") {
          log(`[Fabric] Saldo ${m.empresa}: ${m.saldo ?? "N/D"} (status: ${m.status})`,"info");
        } else if(m.tipo_resposta==="AUDITORIA") {
          log(`[Fabric] Auditoria ${m.empresa}: ${(m.transacoes||[]).length} transações`,"info");
        } else if(m.tipo_resposta==="TRANSFERENCIA") {
          if(m.sucesso) log(`[Fabric] Transferência confirmada no ledger real`,"success");
          else log(`[Fabric] Transferência negada: ${m.motivo}`,"warn");
        }
        render();
      }catch(e2){}
    };
    ws.onerror=()=>{STATE.wsStatus="error";render();};
    ws.onclose=()=>{STATE.wsStatus="sim";log("Desconectado do sistema real","warn");render();};
    STATE.wsObj=ws;
    render();
  }catch(e){STATE.wsStatus="error";log("Falha: "+e.message,"warn");render();}
}

// Envia uma chamada para o Fabric real via WebSocket bidirecional (monitor_bridge.py)
function chamarFabric(payload) {
  if(STATE.wsStatus!=="connected" || !STATE.wsObj) {
    log("Bridge não conectada. Use a aba Bridge para conectar ao sistema real.","warn");
    render(); return;
  }
  STATE.wsObj.send(JSON.stringify(payload));
}

function startAutoSim() {
  if(autoSimTimer) clearInterval(autoSimTimer);
  autoSimTimer=setInterval(()=>{
    if(!STATE.autoSim) return;
    if(Math.random()<0.4){
      const s=`S${Math.floor(Math.random()*8)+1}`;
      const t=TIPOS[Math.floor(Math.random()*TIPOS.length)];
      injectAlert(s,t,TIPO_CRIT[t]);
    }
  },4500);
}

// ─── Helpers de cor ────────────────────────────────────────────────────────
function c_crit(c){return{CRITICA:"var(--color-text-danger)",ALTA:"var(--color-text-warning)",BAIXA:"var(--color-text-info)"}[c]||"var(--color-text-secondary)"}
function bg_crit(c){return{CRITICA:"var(--color-background-danger)",ALTA:"var(--color-background-warning)",BAIXA:"var(--color-background-info)"}[c]||"var(--color-background-secondary)"}
function c_state(s){return{LIVRE:"var(--color-text-success)",OCUPADO:"var(--color-text-warning)",PERDIDO:"var(--color-text-danger)"}[s]||"var(--color-text-secondary)"}
function bg_state(s){return{LIVRE:"var(--color-background-success)",OCUPADO:"var(--color-background-warning)",PERDIDO:"var(--color-background-danger)"}[s]||"var(--color-background-secondary)"}
function c_log(l){return{success:"var(--color-text-success)",warn:"var(--color-text-warning)",critica:"var(--color-text-danger)",alta:"var(--color-text-warning)",info:"var(--color-text-secondary)"}[l]||"var(--color-text-secondary)"}

function tipoLedgerLabel(tipo) {
  return {
    AUTORIZACAO:"💳 Pagamento", LAUDO:"📋 Laudo", REJEICAO:"✕ Rejeição",
    TRANSFERENCIA:"💸 Transferência", TRANSFERENCIA_NEGADA:"✕ Transf. Negada",
    GENESE:"🌱 Gênese"
  }[tipo] || tipo;
}
function corLedger(tipo, integro) {
  if(integro === false) return "var(--color-text-danger)";
  return {
    AUTORIZACAO:"var(--color-text-info)", LAUDO:"var(--color-text-success)",
    REJEICAO:"var(--color-text-danger)", TRANSFERENCIA:"var(--color-text-warning)",
    TRANSFERENCIA_NEGADA:"var(--color-text-danger)", GENESE:"var(--color-text-tertiary)"
  }[tipo]||"var(--color-text-secondary)";
}

// ─── Mapa tático ───────────────────────────────────────────────────────────
function renderMap() {
  const sW=64,sH=54,mX=8,mY=26,gX=4,gY=4;
  const totalW=mX*2+4*sW+3*gX;
  const totalH=mY*2+2*sH+gY;
  const pendByS={},actByS={};
  STATE.queue.forEach(r=>{
    if(r.status==="PENDENTE") pendByS[r.sector]=(pendByS[r.sector]||0)+1;
    if(r.status==="ACEITA") actByS[r.sector]=r.crit;
  });
  let sectors="",dronePts="";
  SECTOR_LAYOUT.forEach(({id,col,row})=>{
    const x=mX+col*(sW+gX), y=mY+row*(sH+gY);
    const p=pendByS[id]||0, a=actByS[id];
    const fl=p>0?(p>2?"danger":"warning"):a?"info":"none";
    const fillMap={danger:"rgba(209,55,55,0.18)",warning:"rgba(186,117,23,0.15)",info:"rgba(24,95,165,0.12)",none:"var(--color-background-primary)"};
    const strMap={danger:"var(--color-border-danger)",warning:"var(--color-border-warning)",info:"var(--color-border-info)",none:"var(--color-border-secondary)"};
    const prio=(PRIORITY_TABLE[id]||[]).map(b=>b[0]).join(">");
    const emp=SECTOR_EMPRESA[id]||"";
    const saldo=STATE.carteiras[emp]??0;
    const saldoColor=saldo<10?"var(--color-text-danger)":saldo<50?"var(--color-text-warning)":"var(--color-text-tertiary)";
    sectors+=`<g>
      <rect x="${x}" y="${y}" width="${sW}" height="${sH}" rx="5" fill="${fillMap[fl]}" stroke="${strMap[fl]}" stroke-width="0.5"/>
      <text x="${x+sW/2}" y="${y+16}" text-anchor="middle" style="font-size:12px;font-weight:500;font-family:var(--font-mono)" fill="var(--color-text-primary)">${id}</text>
      <text x="${x+sW/2}" y="${y+27}" text-anchor="middle" style="font-size:7px;font-family:var(--font-mono)" fill="var(--color-text-tertiary)">${prio}</text>
      <text x="${x+sW/2}" y="${y+40}" text-anchor="middle" style="font-size:8px;font-family:var(--font-mono)" fill="${saldoColor}">${saldo}tk</text>
      ${p>0?`<circle cx="${x+sW-9}" cy="${y+9}" r="8" fill="${fl==="danger"?"rgba(209,55,55,0.3)":"rgba(186,117,23,0.3)"}" stroke="${strMap[fl]}" stroke-width="0.5"/>
      <text x="${x+sW-9}" y="${y+9}" text-anchor="middle" dominant-baseline="central" style="font-size:8px;font-weight:500;font-family:var(--font-mono)" fill="${fl==="danger"?"var(--color-text-danger)":"var(--color-text-warning)"}">${p}</text>`:""}
      ${a?`<circle cx="${x+9}" cy="${y+9}" r="5" fill="rgba(24,95,165,0.3)" stroke="var(--color-border-info)" stroke-width="0.5"/>
      <text x="${x+9}" y="${y+9}" text-anchor="middle" dominant-baseline="central" style="font-size:7px" fill="var(--color-text-info)">A</text>`:""}
    </g>`;
  });
  const bases=["NORTE","SUL","LESTE","OESTE"];
  let baseLabels="";
  bases.forEach(base=>{
    const online=STATE.bases[base];
    const drs=STATE.drones.filter(d=>d.base===base);
    const free=drs.filter(d=>d.state==="LIVRE").length;
    const lost=drs.filter(d=>d.state==="PERDIDO").length;
    const col=!online?"var(--color-text-danger)":lost>0?"var(--color-text-danger)":free>0?"var(--color-text-success)":"var(--color-text-warning)";
    let bx,by,anchor="middle";
    if(base==="NORTE"){bx=totalW/2;by=13;}
    else if(base==="SUL"){bx=totalW/2;by=totalH-4;}
    else if(base==="OESTE"){bx=3;by=totalH/2-5;anchor="start";}
    else{bx=totalW-3;by=totalH/2-5;anchor="end";}
    const label=online?`${base} [${free}/${drs.length}]`:`${base} ✕OFFLINE`;
    baseLabels+=`<text x="${bx}" y="${by}" text-anchor="${anchor}" style="font-size:8px;font-weight:500;font-family:var(--font-mono)" fill="${col}">${label}</text>`;
    drs.forEach((drone,i)=>{
      const stC=!online?"var(--color-text-danger)":c_state(drone.state);
      const op=(!online||drone.state==="PERDIDO")?0.25:1;
      let dx,dy;
      if(base==="NORTE"){dx=totalW/2-((drs.length-1)*8)+i*16;dy=20;}
      else if(base==="SUL"){dx=totalW/2-((drs.length-1)*8)+i*16;dy=totalH-14;}
      else if(base==="OESTE"){dx=12;dy=totalH/2-((drs.length-1)*7)+i*14;}
      else{dx=totalW-12;dy=totalH/2-((drs.length-1)*7)+i*14;}
      dronePts+=`<polygon points="${dx},${dy-5} ${dx-5},${dy+4} ${dx+5},${dy+4}" fill="${stC}" opacity="${op}" stroke="none"/>`;
    });
  });
  return `<svg width="100%" viewBox="0 0 ${totalW} ${totalH}" style="display:block">
    ${baseLabels}${sectors}${dronePts}
  </svg>`;
}

function renderDroneCard(d) {
  const mShort=d.mission?d.mission.slice(0,6):"—";
  const baseOnline=STATE.bases[d.base];
  return `<div style="display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--border-radius-md);background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);margin-bottom:5px;opacity:${!baseOnline?'0.55':'1'}">
    <div style="width:8px;height:8px;border-radius:50%;flex-shrink:0;background:${c_state(d.state)}"></div>
    <div style="flex:1;min-width:0">
      <div class="mono" style="font-size:11px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--color-text-primary)">${d.id}</div>
      <div style="font-size:10px;color:var(--color-text-secondary)">Base:${d.base}${!baseOnline?' <span style="color:var(--color-text-danger)">[OFFLINE]</span>':''} · P:${d.port} · Missao:${mShort}</div>
    </div>
    <span class="badge" style="background:${bg_state(d.state)};color:${c_state(d.state)};border-color:${c_state(d.state)}22">${d.state}</span>
    <div style="display:flex;gap:4px;flex-shrink:0">
      ${d.state==="PERDIDO"&&baseOnline?`<button onclick="reviveDrone('${d.id}')" style="font-size:10px;padding:2px 7px;color:var(--color-text-success)">↺</button>`:""}
      ${d.state==="LIVRE"&&baseOnline?`<button onclick="killDrone('${d.id}')" style="font-size:10px;padding:2px 7px;color:var(--color-text-danger)">✕</button>`:""}
      ${d.state!=="OCUPADO"?`<button onclick="removeDrone('${d.id}')" style="font-size:10px;padding:2px 5px">−</button>`:""}
    </div>
  </div>`;
}

function renderQueueItem(r) {
  const done=r.status==="CONCLUIDA";
  const rej=r.status==="REJEITADA";
  const active=r.status==="ACEITA";
  const bg=active?"var(--color-background-info)":rej?"var(--color-background-danger)":"var(--color-background-primary)";
  const statusLabel=r.status==="PENDENTE"?"PEND":r.status==="ACEITA"?"ATIVO":r.status==="REJEITADA"?"REJ":"OK";
  const statusColor=r.status==="PENDENTE"?"var(--color-text-warning)":r.status==="ACEITA"?"var(--color-text-info)":r.status==="REJEITADA"?"var(--color-text-danger)":"var(--color-text-tertiary)";
  return `<div style="display:flex;align-items:center;gap:5px;padding:5px 8px;border-radius:var(--border-radius-md);background:${bg};border:0.5px solid var(--color-border-tertiary);margin-bottom:3px;opacity:${done||rej?"0.5":"1"}">
    <div style="width:7px;height:7px;border-radius:50%;flex-shrink:0;background:${(done||rej)?"var(--color-text-tertiary)":c_crit(r.crit)}"></div>
    <span class="mono" style="font-size:11px;font-weight:500;min-width:22px;color:var(--color-text-primary)">${r.sector}</span>
    <span style="flex:1;font-size:10px;color:var(--color-text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.tipo.replace(/_/g," ")}</span>
    <span class="badge" style="background:${(done||rej)?"var(--color-background-secondary)":bg_crit(r.crit)};color:${(done||rej)?"var(--color-text-tertiary)":c_crit(r.crit)};border-color:transparent">${r.crit.slice(0,3)}</span>
    <span class="mono" style="font-size:9px;min-width:32px;text-align:right;color:${statusColor}">${statusLabel}</span>
    <span class="mono" style="font-size:9px;color:var(--color-text-tertiary);min-width:30px">L:${r.ts}</span>
  </div>`;
}

// ─── Aba Auditoria / Financeiro ────────────────────────────────────────────
function renderAuditoria() {
  const filtroEmp = STATE.auditFiltroEmpresa;
  const filtroTipo = STATE.auditFiltroTipo;
  const tf = STATE.transferForm;

  const blocosFiltrados = STATE.ledger.filter(e => {
    const empMatch = filtroEmp==="TODAS" || e.empresa===filtroEmp || e.destino===filtroEmp;
    const tipoMatch = filtroTipo==="TODOS" || e.tipo===filtroTipo;
    return empMatch && tipoMatch;
  });

  const totalTokens = Object.values(STATE.carteiras).reduce((s,v)=>s+v,0);
  const blocoCount  = STATE.ledger.length;
  const adulterados = STATE.ledger.filter(e=>e.integro===false).length;
  const integridadeColor = STATE.ledgerOk===null?"var(--color-text-warning)":STATE.ledgerOk?"var(--color-text-success)":"var(--color-text-danger)";
  const integridadeLabel = STATE.ledgerOk===null?"NÃO VERIFICADO":STATE.ledgerOk?"✓ ÍNTEGRO":"⚠ ADULTERADO";

  return `
  <!-- Sumário do ledger -->
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px">
    ${[
      {l:"BLOCOS",v:blocoCount,c:"var(--color-text-primary)"},
      {l:"TOKENS TOTAL",v:totalTokens,c:"var(--color-text-info)"},
      {l:"REJEITADAS",v:STATE.stats.rejeitados,c:"var(--color-text-danger)"},
      {l:"INTEGRIDADE",v:integridadeLabel,c:integridadeColor},
    ].map(x=>`<div style="background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:6px 8px;text-align:center">
      <div style="font-size:9px;color:var(--color-text-tertiary);margin-bottom:2px">${x.l}</div>
      <div class="mono" style="font-size:12px;font-weight:500;color:${x.c}">${x.v}</div>
    </div>`).join("")}
  </div>

  <!-- Carteiras das empresas -->
  <div style="margin-bottom:12px">
    <div style="font-size:12px;font-weight:500;margin-bottom:6px;color:var(--color-text-primary)">Carteiras das Empresas</div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:4px">
      ${EMPRESAS.map(e=>{
        const s=STATE.carteiras[e]??0;
        const sc=s===0?"var(--color-text-danger)":s<30?"var(--color-text-warning)":"var(--color-text-success)";
        return `<div style="padding:6px 8px;background:var(--color-background-primary);border:0.5px solid ${s===0?"var(--color-border-danger)":s<30?"var(--color-border-warning)":"var(--color-border-tertiary)"};border-radius:var(--border-radius-md);text-align:center">
          <div style="font-size:9px;color:var(--color-text-tertiary);margin-bottom:2px">${e.replace("EMPRESA-","EMP-")}</div>
          <div class="mono" style="font-size:14px;font-weight:500;color:${sc}">${s}</div>
          <div style="font-size:8px;color:var(--color-text-tertiary)">tokens</div>
        </div>`;
      }).join("")}
    </div>
    <div style="display:flex;gap:6px;margin-top:6px">
      <button onclick="recarregarCarteiras()" style="font-size:11px;padding:4px 10px;color:var(--color-text-success);border-color:var(--color-border-success)44;flex:1">↺ Recarregar Carteiras (init_ledger)</button>
      ${STATE.wsStatus==="connected"?`<button onclick="EMPRESAS.forEach(e=>chamarFabric({tipo:'GET_SALDO',empresa:e}))" style="font-size:11px;padding:4px 10px;color:var(--color-text-info);border-color:var(--color-border-info)44;flex:1">🔗 Consultar Saldos no Fabric Real</button>`:""}
    </div>
  </div>

  <!-- Transferência entre empresas -->
  <div style="background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:10px;margin-bottom:12px">
    <div style="font-size:12px;font-weight:500;margin-bottom:8px;color:var(--color-text-primary)">Transferência de Tokens (TransferirTokens)</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 80px;gap:6px;margin-bottom:6px">
      <div>
        <div style="font-size:10px;color:var(--color-text-secondary);margin-bottom:3px">Origem</div>
        <select onchange="STATE.transferForm.origem=this.value">
          ${EMPRESAS.map(e=>`<option value="${e}" ${tf.origem===e?"selected":""}>${e} (${STATE.carteiras[e]??0}tk)</option>`).join("")}
        </select>
      </div>
      <div>
        <div style="font-size:10px;color:var(--color-text-secondary);margin-bottom:3px">Destino</div>
        <select onchange="STATE.transferForm.destino=this.value">
          ${EMPRESAS.map(e=>`<option value="${e}" ${tf.destino===e?"selected":""}>${e} (${STATE.carteiras[e]??0}tk)</option>`).join("")}
        </select>
      </div>
      <div>
        <div style="font-size:10px;color:var(--color-text-secondary);margin-bottom:3px">Valor (tk)</div>
        <input type="number" min="1" value="${tf.valor}" oninput="STATE.transferForm.valor=+this.value">
      </div>
    </div>
    <div style="display:flex;gap:6px">
      <button onclick="transferirTokens(STATE.transferForm.origem,STATE.transferForm.destino,STATE.transferForm.valor)" style="flex:1;padding:7px;font-weight:500;background:var(--color-background-warning);color:var(--color-text-warning);border-color:var(--color-border-warning)22">
        💸 Executar Transferência
      </button>
      ${STATE.wsStatus==="connected"?`<button onclick="chamarFabric({tipo:'TRANSFERIR',origem:STATE.transferForm.origem,destino:STATE.transferForm.destino,valor:STATE.transferForm.valor})" style="flex:1;padding:7px;font-weight:500;background:var(--color-background-info);color:var(--color-text-info);border-color:var(--color-border-info)22">🔗 Executar no Fabric Real</button>`:""}
    </div>
  </div>

  <div style="background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:10px;margin-bottom:12px">
    <div style="font-size:12px;font-weight:500;margin-bottom:6px;color:var(--color-text-primary)">Log Imutável — Teste de Adulteração</div>
    <div style="font-size:11px;color:var(--color-text-secondary);margin-bottom:8px">
      Cada bloco guarda o hash do bloco anterior. Adulterar um bloco sem recalcular quebra a cadeia — detectável por qualquer nó do consórcio.
    </div>
    <div style="display:flex;gap:6px">
      <button onclick="verificarIntegridadeLedger()" style="flex:1;padding:7px;font-weight:500;background:var(--color-background-success);color:var(--color-text-success);border-color:var(--color-border-success)22">
        🔍 Verificar Integridade da Cadeia
      </button>
      <button onclick="simularAdulteracaoLedger()" style="flex:1;padding:7px;font-weight:500;background:var(--color-background-danger);color:var(--color-text-danger);border-color:var(--color-border-danger)22">

    ${adulterados>0?`<div style="margin-top:8px;padding:8px;background:var(--color-background-danger);border:0.5px solid var(--color-border-danger);border-radius:var(--border-radius-md);font-size:11px;color:var(--color-text-danger)">
      ⚠ ${adulterados} bloco(s) com hash inválido detectados. Clique em "Verificar Integridade" para confirmar.
    </div>`:""}
  </div>

  <!-- Filtros + lista de blocos -->
  <div style="display:flex;gap:6px;margin-bottom:8px">
    <div style="flex:1">
      <select onchange="STATE.auditFiltroEmpresa=this.value;render()">
        <option value="TODAS" ${filtroEmp==="TODAS"?"selected":""}>Todas as empresas</option>
        ${EMPRESAS.map(e=>`<option value="${e}" ${filtroEmp===e?"selected":""}>${e}</option>`).join("")}
      </select>
    </div>
    <div style="flex:1">
      <select onchange="STATE.auditFiltroTipo=this.value;render()">
        ${["TODOS","AUTORIZACAO","LAUDO","REJEICAO","TRANSFERENCIA","TRANSFERENCIA_NEGADA","GENESE"]
          .map(t=>`<option value="${t}" ${filtroTipo===t?"selected":""}>${t==="TODOS"?"Todos os tipos":tipoLedgerLabel(t)}</option>`).join("")}
      </select>
    </div>
    <button onclick="STATE.ledger=[];STATE.ledgerOk=null;render()" style="font-size:11px;padding:4px 8px">🗑 Limpar</button>
  </div>

  <div class="scroll" style="max-height:280px">
    ${blocosFiltrados.length===0
      ?`<div style="text-align:center;padding:20px;color:var(--color-text-tertiary);font-size:12px">Nenhum bloco no ledger ainda — injete alertas para gerar transações</div>`
      :blocosFiltrados.slice(0,80).map(e=>{
        const integroIcon = e.integro===undefined?"⬜":e.integro?"✓":"✗ ADULTERADO";
        const integroColor = e.integro===undefined?"var(--color-text-tertiary)":e.integro?"var(--color-text-success)":"var(--color-text-danger)";
        const cor = corLedger(e.tipo, e.integro===false?false:undefined);
        let detalhe = "";
        if(e.tipo==="AUTORIZACAO") detalhe=`${e.empresa} −${e.custo}tk → req ${(e.requisicao||"").slice(0,6)} | restam ${e.saldoRestante}tk`;
        else if(e.tipo==="LAUDO")  detalhe=`${e.drone?.replace("DRONE-","")??""} → setor ${e.setor} | ${e.tipo||""} [${e.criticidade||""}]`;
        else if(e.tipo==="REJEICAO") detalhe=`${e.empresa} | ${e.motivo}`;
        else if(e.tipo==="TRANSFERENCIA") detalhe=`${e.empresa} → ${e.destino} | ${e.valor}tk`;
        else if(e.tipo==="TRANSFERENCIA_NEGADA") detalhe=`${e.empresa} → ${e.destino} | ${e.motivo}`;
        else if(e.tipo==="GENESE") detalhe=e.motivo||"";
        return `<div style="display:flex;gap:6px;padding:5px 8px;border-radius:var(--border-radius-md);background:var(--color-background-primary);border:0.5px solid ${e.integro===false?"var(--color-border-danger)":"var(--color-border-tertiary)"};margin-bottom:3px">
          <div style="display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0;min-width:16px">
            <div style="width:6px;height:6px;border-radius:50%;background:${cor}"></div>
            <div style="width:1px;flex:1;background:var(--color-border-tertiary)"></div>
          </div>
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:2px">
              <span style="font-size:11px;font-weight:500;color:${cor}">${tipoLedgerLabel(e.tipo)}</span>
              <span class="mono" style="font-size:9px;color:var(--color-text-tertiary)">${e.ts}</span>
              <span class="mono" style="font-size:9px;color:${integroColor};margin-left:auto">${integroIcon}</span>
            </div>
            <div style="font-size:10px;color:var(--color-text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${detalhe}</div>
            <div class="mono" style="font-size:8px;color:var(--color-text-tertiary);margin-top:2px">blk:${e.id} hash:${e.hash} prev:${e.hashAnterior}</div>
          </div>
        </div>`;
      }).join("")}
  </div>

  ${STATE.wsStatus==="connected"?`<div style="margin-top:8px;padding:8px;background:var(--color-background-success);border:0.5px solid var(--color-border-success);border-radius:var(--border-radius-md);font-size:11px;color:var(--color-text-success)">

      <input type="range" min="1" max="20" step="1" value="${bc.rate}" ${STATE.bombarding?"disabled":""} oninput="STATE.bombCfg.rate=+this.value;render()">

    ${STATE.bombarding?`<div style="padding:10px;background:var(--color-background-warning);border:0.5px solid var(--color-border-warning);border-radius:var(--border-radius-md);margin-bottom:8px">
      <div class="mono" style="font-size:12px;color:var(--color-text-warning)">BOMBARDEANDO... ${STATE.bombSent}/${STATE.bombTotal}</div>
      <div style="margin-top:6px;height:5px;background:var(--color-background-secondary);border-radius:3px;overflow:hidden">

            </div>
          </div>
          <div style="display:flex;gap:5px">
            ${online?`<button onclick="killBase('${base}')" style="font-size:11px;padding:4px 10px;color:var(--color-text-danger);border-color:var(--color-border-danger)44">✕ Derrubar</button>`
                    :`<button onclick="reviveBase('${base}')" style="font-size:11px;padding:4px 10px;color:var(--color-text-success);border-color:var(--color-border-success)44">↺ Restaurar</button>`}

        <input type="number" value="${nd.port}" oninput="STATE.newDrone.port=+this.value" placeholder="Porta">

    </div>

    ${STATE.drones.map(d=>{
      const bOn=STATE.bases[d.base];
      return `<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:0.5px solid var(--color-border-tertiary)">
        <div><div class="mono" style="font-size:11px;color:var(--color-text-primary)">${d.id.replace("DRONE-","")}</div>

        <div style="display:flex;gap:6px">
          ${d.state==="PERDIDO"&&bOn?`<button onclick="reviveDrone('${d.id}')" style="font-size:11px;color:var(--color-text-success)">Reconectar</button>`:""}

      </div>`;

  if(STATE.tab==="audit") return renderAuditoria();

  if(STATE.tab==="bridge") return `
    <p style="margin:0 0 10px;font-size:12px;color:var(--color-text-secondary)">Conecte ao sistema Python real. O broker envia eventos UDP na porta 8000 via <span class="mono">notificar_monitor()</span>. A bridge bidirecional também encaminha chamadas ao Hyperledger Fabric.</p>
    <div style="margin-bottom:8px"><label style="font-size:12px;color:var(--color-text-secondary);display:block;margin-bottom:4px">URL WebSocket</label>
    <input type="text" value="${STATE.wsUrl}" oninput="STATE.wsUrl=this.value"></div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
      <div style="width:8px;height:8px;border-radius:50%;background:${STATE.wsStatus==="connected"?"var(--color-text-success)":STATE.wsStatus==="error"?"var(--color-text-danger)":"var(--color-text-tertiary)"}"></div>
      <span style="font-size:12px;color:var(--color-text-secondary)">${STATE.wsStatus==="connected"?"Conectado ao sistema real":STATE.wsStatus==="error"?"Erro de conexão":"Modo simulação"}</span>
    </div>
    <button onclick="${STATE.wsStatus==="connected"?"STATE.wsObj&&STATE.wsObj.close()":"connectWs()"}" style="width:100%;padding:9px;font-weight:500;margin-bottom:12px;background:${STATE.wsStatus==="connected"?"var(--color-background-danger)":"var(--color-background-success)"};color:${STATE.wsStatus==="connected"?"var(--color-text-danger)":"var(--color-text-success)"};border-color:transparent">
      ${STATE.wsStatus==="connected"?"Desconectar":"Conectar ao Sistema Real"}
    </button>
    <div style="font-size:12px;font-weight:500;margin-bottom:6px">monitor_bridge.py (versão bidirecional com Fabric):</div>
    <div style="background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:10px">
<pre># Execute: python monitor/monitor_bridge.py
# Requer: pip install websockets
# A versão bidirecional encaminha chamadas
# GET_SALDO / GET_AUDITORIA / TRANSFERIR
# direto para o Hyperledger Fabric via ledger_client.py</pre></div>`;

  return "";
}

// ─── RENDER principal ──────────────────────────────────────────────────────
function render() {
  const S=STATE;
  S.lamport=lamportClock;

  const qSorted=[...S.queue].sort((a,b)=>{
    const ord={PENDENTE:0,ACEITA:1,CONCLUIDA:2,REJEITADA:3};
    if(ord[a.status]!==ord[b.status]) return ord[a.status]-ord[b.status];
    return (CRIT_PESO[b.crit]||1)-(CRIT_PESO[a.crit]||1);
  }).slice(0,30);

  const pendN=S.queue.filter(r=>r.status==="PENDENTE").length;
  const actN=S.queue.filter(r=>r.status==="ACEITA").length;
  const freeN=S.drones.filter(d=>d.state==="LIVRE"&&S.bases[d.base]).length;
  const onlineBases=Object.values(S.bases).filter(Boolean).length;
  const blocos=S.ledger.length;
  const adulterados=S.ledger.filter(e=>e.integro===false).length;
  const integridadeColor=S.ledgerOk===null?"var(--color-text-warning)":S.ledgerOk?"var(--color-text-success)":"var(--color-text-danger)";

  // 5 abas agora
  const tabs=[
    {k:"inject",l:"Injetar Alerta"},
    {k:"stress",l:"Stress Test"},
    {k:"drone",l:"Drones & Bases"},
    {k:"audit",l:"📊 Auditoria"},
    {k:"bridge",l:"Bridge"}
  ];

  document.getElementById("app").innerHTML = `
  <div style="display:flex;align-items:flex-start;justify-content:space-between;padding:10px 0 14px;border-bottom:0.5px solid var(--color-border-tertiary);margin-bottom:14px;flex-wrap:wrap;gap:8px">

      <div class="mono" style="font-size:17px;font-weight:500;color:var(--color-text-primary)">ORMUZ COMMAND CENTER</div>

        {l:"LAMPORT",v:S.lamport,c:"var(--color-text-primary)"},

        {l:"ACEITAS",v:S.stats.aceitas,c:"var(--color-text-info)"},
        {l:"CONCLUÍDAS",v:S.stats.concluidas,c:"var(--color-text-success)"},
        {l:"REJEITADAS",v:S.stats.rejeitados,c:"var(--color-text-danger)"},
        {l:"BASES OK",v:`${onlineBases}/4`,c:onlineBases===4?"var(--color-text-success)":onlineBases===0?"var(--color-text-danger)":"var(--color-text-warning)"},
        {l:"BLOCOS",v:blocos,c:adulterados>0?"var(--color-text-danger)":integridadeColor},
      ].map(x=>`<div style="background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:5px 10px;text-align:center;min-width:60px">
        <div style="font-size:9px;color:var(--color-text-tertiary);margin-bottom:2px">${x.l}</div>
        <div class="mono" style="font-size:18px;font-weight:500;color:${x.c};line-height:1">${x.v}</div>
      </div>`).join("")}
      <div style="background:${S.wsStatus==="connected"?"var(--color-background-success)":"var(--color-background-secondary)"};border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:5px 10px;text-align:center;cursor:pointer" onclick="STATE.tab='bridge';render()">
        <div style="font-size:9px;color:var(--color-text-tertiary);margin-bottom:2px">STATUS</div>
        <div class="mono" style="font-size:12px;font-weight:500;color:${S.wsStatus==="connected"?"var(--color-text-success)":S.wsStatus==="error"?"var(--color-text-danger)":"var(--color-text-warning)"}">${S.wsStatus==="connected"?"REAL":S.wsStatus==="error"?"ERRO":"SIM"}</div>

      <div class="card">
        <div style="display:grid;grid-template-columns:repeat(5,1fr);margin:-12px -12px 12px;border-bottom:0.5px solid var(--color-border-tertiary)">
          ${tabs.map(t=>`<button onclick="STATE.tab='${t.k}';render()" style="padding:8px 2px;font-size:10px;font-weight:${S.tab===t.k?500:400};background:${S.tab===t.k?"var(--color-background-primary)":"transparent"};border:none;border-radius:0;border-bottom:${S.tab===t.k?"2px solid var(--color-text-info)":"2px solid transparent"};color:${S.tab===t.k?"var(--color-text-primary)":"var(--color-text-secondary)"};cursor:pointer;transition:all 0.15s">${t.l}</button>`).join("")}
        </div>
        ${renderTabContent()}
      </div>
    </div>
  </div>`;
}
