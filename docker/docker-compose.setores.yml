# =============================================================
#  PC 1 — Brokers de Setor (S1 a S8)
#  Rodar com: docker compose -f docker-compose.setores.yml up
# =============================================================

services:

  broker_s1:
    build:
      context: ..
      dockerfile: setor/dockerfile
    container_name: broker_s1
    restart: unless-stopped
    ports:
      - "${PORTA_S1}:${PORTA_S1}"
    environment:
      SETOR_ID: "S1"
      SETOR_NOME: "Norte"
      MINHA_PORTA: "${PORTA_S1}"
      IP_MONITOR: "${IP_MONITOR}"
      IP_BASE_NORTE: "${IP_PC_BASES}"
      IP_BASE_SUL: "${IP_PC_BASES}"
      IP_BASE_LESTE: "${IP_PC_BASES}"
      IP_BASE_OESTE: "${IP_PC_BASES}"
      PORTA_BASE_NORTE: "${PORTA_BASE_NORTE}"
      PORTA_BASE_SUL: "${PORTA_BASE_SUL}"
      PORTA_BASE_LESTE: "${PORTA_BASE_LESTE}"
      PORTA_BASE_OESTE: "${PORTA_BASE_OESTE}"
      PRIORIDADE: "NORTE,OESTE,LESTE,SUL"
      # Credenciais e Autenticação no Fabric
      FABRIC_ORG_DOMAIN: "norte.ormuz.com"
      FABRIC_USER: "Admin"
      FABRIC_PEERS: "peer0.norte.ormuz.com"
    volumes:
      - ../fabric/crypto-config:/app/fabric/crypto-config:ro
    networks:
      - ormuz_net
      - ormuz_fabric

