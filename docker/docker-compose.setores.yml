networks:
  ormuz_net:
    driver: bridge
  # IMPORTANTE: Confirme se o nome da sua rede do Fabric é exatamente este.
  # Se ao fazer "docker network ls" aparecer "fabric_default" ou "docker_ormuz_fabric", 
  # altere apenas a linha abaixo para corresponder a esse nome.
  ormuz_fabric:
    external: true