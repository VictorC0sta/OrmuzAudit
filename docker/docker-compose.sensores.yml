services:

  sensor_s1:
    build:
      context: ..
      dockerfile: sensor/dockerfile
    container_name: sensor_s1
    restart: unless-stopped
    environment:
      SENSOR_ID: "SENSOR-S1"
      SETOR_ID: "S1"
      EMPRESA_ID: "${EMPRESA_S1_ID:-EMPRESA-A}"
      CARTEIRA_ID: "${CARTEIRA_S1_ID:-wallet-s1}"
      IP_BROKER_SETOR: "${IP_PC_SETORES}"
      PORTA_BROKER_SETOR: "${PORTA_S1}"
      INTERVALO_MIN: "5"
      INTERVALO_MAX: "15"
    networks:
      - ormuz_net

